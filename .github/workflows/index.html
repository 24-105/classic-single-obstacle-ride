<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自転車ダッシュ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316181d'/%3E%3Ccircle cx='19' cy='43' r='8' fill='none' stroke='%23f1f4f2' stroke-width='4'/%3E%3Ccircle cx='47' cy='43' r='8' fill='none' stroke='%23f1f4f2' stroke-width='4'/%3E%3Cpath d='M18 42h13l7-13h8l4 13M28 41l7-11' fill='none' stroke='%23c9a45f' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M27 30h17' stroke='%23777d82' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GMW7KRPNFQ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-GMW7KRPNFQ");
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="stage" aria-label="軽量自転車障害物回避3Dゲーム"></canvas>

      <header class="topbar">
        <div class="top-actions">
          <button
            class="button primary"
            id="startButton"
            type="button"
            aria-label="スタート"
          >
            ▶ スタート
          </button>
          <button
            class="button reset-button"
            id="resetButton"
            type="button"
            aria-label="リトライ"
          >
            ↻ リトライ
          </button>
          <button
            class="button icon-button"
            id="captureButton"
            type="button"
            aria-label="画像保存"
            title="画像保存"
          >
            <span aria-hidden="true">↓</span>
          </button>
        </div>
      </header>

      <section class="hud" aria-label="ゲーム状態">
        <div class="metric primary-metric">
          <span class="metric-label">スコア</span>
          <strong id="scoreValue">0000</strong>
        </div>
        <div class="metric combo-metric">
          <span class="metric-label">コンボ</span>
          <strong id="comboValue">×1</strong>
        </div>
        <div class="metric high-score-metric">
          <span class="metric-label">ベスト</span>
          <strong id="highScoreValue">0000</strong>
        </div>
        <div class="metric level-metric">
          <span class="metric-label">レベル</span>
          <strong id="levelValue">0001</strong>
        </div>
        <div class="metric rush-metric">
          <span class="metric-label">ラッシュ</span>
          <strong id="rushValue">0%</strong>
        </div>
        <div class="metric life-metric">
          <span class="metric-label">ライフ</span>
          <strong id="lifeValue" class="life-track" aria-label="ライフ 4"></strong>
        </div>
      </section>

      <div class="goal-strip" aria-label="チャレンジ">
        <span>目標</span>
        <strong id="goalText">コインを3個集める</strong>
      </div>

      <div class="status-pill" id="gameStatus"></div>

      <section
        class="game-over-overlay"
        id="gameOverOverlay"
        aria-live="polite"
        aria-hidden="true"
      >
        <div class="game-over-card">
          <span>ゲームオーバー</span>
          <div class="game-over-stats">
            <div class="game-over-stat">
              <em>スコア</em>
              <strong id="finalScoreValue">0000</strong>
            </div>
            <div class="game-over-stat">
              <em>ベスト</em>
              <strong id="finalBestScoreValue">0000</strong>
            </div>
          </div>
        </div>
      </section>

      <nav class="command-bar" aria-label="ライド操作">
        <button
          class="command-button"
          id="leftButton"
          type="button"
          aria-label="左へ"
          title="左へ"
        >
          <span aria-hidden="true">←</span>
        </button>
        <button
          class="command-button jump-command"
          id="jumpButton"
          type="button"
          aria-label="ジャンプ"
          title="ジャンプ"
        >
          <span aria-hidden="true">↑</span>
        </button>
        <button
          class="command-button"
          id="rightButton"
          type="button"
          aria-label="右へ"
          title="右へ"
        >
          <span aria-hidden="true">→</span>
        </button>
      </nav>

      <footer class="model-plaque" aria-label="車体情報">
        <span>軽量自転車</span>
        <span>スマホブラウザゲーム</span>
      </footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
