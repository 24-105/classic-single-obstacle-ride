        "@type": "VideoGame",
        "name": "自転車ダッシュ",
        "description": "スマホのブラウザで遊べる軽量3D障害物回避ゲームです。左右移動とジャンプで障害物を避け、コンボ、ラッシュ、神回避でハイスコアを狙います。",

  <body>
    <main id="app">
      <canvas id="stage" aria-label="自転車障害物回避ゲーム"></canvas>

      <header class="topbar">
        <div class="top-actions">
          <button
            class="button primary"
            id="startButton"
            type="button"
            aria-label="開始"
          >
            ▶ 開始
          </button>
          <button
            class="button reset-button"
            id="resetButton"
            type="button"
            aria-label="もう一度"
          >
            ↻ もう一度
          </button>
          <button
            class="button icon-button"
            id="captureButton"
            type="button"
            aria-label="画像保存"
            title="画像保存"
          >
            <span aria-hidden="true">↓</span>
          </button>
        </div>
      </header>

      <section class="hud" aria-label="ゲーム状態">
        <div class="metric primary-metric">
          <span class="metric-label">スコア</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="metric combo-metric">
          <span class="metric-label">コンボ</span>
          <strong id="comboValue">×1</strong>
        </div>
        <div class="metric high-score-metric">
          <span class="metric-label">最高</span>
          <strong id="highScoreValue">0</strong>
        </div>
        <div class="metric level-metric">
          <span class="metric-label">レベル</span>
          <strong id="levelValue">1</strong>
        </div>
        <div class="metric rush-metric">
          <span class="metric-label">ラッシュ</span>
          <strong id="rushValue">0%</strong>
        </div>
        <div class="metric life-metric">
          <span class="metric-label">ライフ</span>
          <strong id="lifeValue" class="life-track" aria-label="ライフ 4"></strong>
        </div>
      </section>

      <div class="goal-strip" aria-label="ボーナス">
        <span>ボーナス</span>
        <strong id="goalText">コインを4個集める</strong>
      </div>

      <div class="segment-strip" id="segmentStrip" aria-label="区間" hidden>
        <span>区間</span>
        <strong id="segmentText">市街地</strong>
      </div>

      <div class="status-pill" id="gameStatus"></div>

      <section
        class="game-over-overlay"
        id="gameOverOverlay"
        aria-live="polite"
        aria-hidden="true"
      >
        <div class="game-over-card">
          <span>ゲームオーバー</span>
          <div class="game-over-rank">
            <em>ランク</em>
            <strong id="finalRankValue">C</strong>
          </div>
          <div class="game-over-stats">
            <div class="game-over-stat game-over-main-stat">
              <em>スコア</em>
              <strong id="finalScoreValue">0</strong>
            </div>
            <div class="game-over-stat game-over-main-stat">
              <em>最高</em>
              <strong id="finalBestScoreValue">0</strong>
            </div>
            <div class="game-over-stat">
              <em>最高コンボ</em>
              <strong id="finalComboValue">×1</strong>
            </div>
            <div class="game-over-stat">
              <em>神回避/跳び越え</em>
              <strong id="finalSkillValue">0/0</strong>
            </div>
          </div>
          <p class="game-over-thanks">
            遊んでくれてありがとう！<br />
            このURLをブックマークしてまた遊んでね！
          </p>
          <section class="recommend-panel" aria-label="おすすめのゲーム">
            <div class="recommend-heading">
              <span>次に遊ぶ</span>
              <strong>スマホで遊べる</strong>
            </div>
            <div class="recommend-list">
              <a
                class="recommend-card"
                href="https://24-105.github.io/machi-narabe/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="おすすめゲーム"
              >
                <span class="recommend-card-art" aria-hidden="true">
                  <img
                    class="recommend-favicon"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                    alt=""
                    width="36"
                    height="36"
                    decoding="async"
                  />
                </span>
                <span class="recommend-card-copy">
                  <em></em>
                  <strong></strong>
                  <small></small>
                </span>
                <b aria-hidden="true">遊ぶ</b>
              </a>
              <a
                class="recommend-card"
                href="https://24-105.github.io/kameposu/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="おすすめゲーム"
              >
                <span class="recommend-card-art" aria-hidden="true">
                  <img
                    class="recommend-favicon"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                    alt=""
                    width="36"
                    height="36"
                    decoding="async"
                  />
                </span>
                <span class="recommend-card-copy">
                  <em></em>
                  <strong></strong>
                  <small></small>
                </span>
                <b aria-hidden="true">遊ぶ</b>
              </a>
              <a
                class="recommend-card"
                href="https://24-105.github.io/hitoyo-saishucho/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="おすすめゲーム"
              >
                <span class="recommend-card-art" aria-hidden="true">
                  <img
                    class="recommend-favicon"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                    alt=""
                    width="36"
                    height="36"
                    decoding="async"
                  />
                </span>
                <span class="recommend-card-copy">
                  <em></em>
                  <strong></strong>
                  <small></small>
                </span>
                <b aria-hidden="true">遊ぶ</b>
              </a>
            </div>
          </section>
        </div>
      </section>

      <nav class="command-bar" aria-label="自転車操作">
        <button
          class="command-button"
          id="leftButton"
          type="button"
          aria-label="左へ"
          title="左へ"
        >
          <span aria-hidden="true">←</span>
        </button>
        <button
          class="command-button jump-command"
          id="jumpButton"
          type="button"
          aria-label="ジャンプ"
          title="ジャンプ"
        >
          <span aria-hidden="true">↑</span>
        </button>
        <button
          class="command-button"
          id="rightButton"
          type="button"
          aria-label="右へ"
          title="右へ"
        >
          <span aria-hidden="true">→</span>
        </button>
      </nav>

      <footer class="model-plaque" aria-label="車体情報">
        <span>軽量自転車</span>
        <span>スマホ用ゲーム</span>
      </footer>
    </main>

    <script type="module" src="./src/main.js"></script>
